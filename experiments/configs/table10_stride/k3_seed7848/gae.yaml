# MOSTA E16.5, stride k=3 (every 3-th section observed), training seed 7848 (Tables 10/11).
data:
  h5ad: data/mosta/E16.5_10percent_noCavity_coor_leiden_hologene_full_top3000.h5ad
  signature_key: leiden
  subsample_fraction: 0.5
  subsample_seed: 8848
  n_top_genes: 3000
  keep_ratio: true
  split: stride
  stride: 3
  n_neighbors: 5

gae:
  hidden_dims: [2048, 512]
  latent_dim: 64
  in_logarithm: false

training:
  seed: 7848
  epochs: 200
  batch_size: 512
  lr: 0.00001

output_dir: outputs/mosta/table10_stride/k3_seed7848/gae
