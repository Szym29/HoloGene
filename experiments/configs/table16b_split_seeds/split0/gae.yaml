# MOSTA E16.5, 8:2 split with split seed 0 (Tables 16b/18).
data:
  h5ad: data/mosta/E16.5_10percent_noCavity_coor_leiden_hologene_full_top3000.h5ad
  signature_key: leiden
  subsample_fraction: 0.5
  subsample_seed: 8848
  n_top_genes: 3000
  keep_ratio: true
  split: random
  test_fraction: 0.2
  split_seed: 0
  n_neighbors: 5

gae:
  hidden_dims: [2048, 512]
  latent_dim: 64
  in_logarithm: false

training:
  seed: 8848
  epochs: 200
  batch_size: 512
  lr: 0.00001

output_dir: outputs/mosta/table16b_split_seeds/split0/gae
